<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Search</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
    }

    .google {
      font-size: 90px;
      font-weight: 500;
      letter-spacing: -6px;
      margin-bottom: 30px;
    }

    .blue { color: #4285f4; }
    .red { color: #ea4335; }
    .yellow { color: #fbbc05; }
    .green { color: #34a853; }

    form {
      width: min(90%, 584px);
    }

    .search-box {
      width: 100%;
      height: 46px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 20px;
      font-size: 16px;
      outline: none;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
    }

    .search-box:focus {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.25);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      border: 1px solid #f8f9fa;
      background: #f8f9fa;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 14px;
      color: #202124;
      cursor: pointer;
    }

    button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,.1);
    }
  </style>
</head>

<body>

  <div class="google">
    <span class="blue">G</span>
    <span class="red">o</span>
    <span class="yellow">o</span>
    <span class="blue">g</span>
    <span class="green">l</span>
    <span class="red">e</span>
  </div>

  <form action="https://www.google.com/search" method="GET">
    <input
      class="search-box"
      type="text"
      name="q"
      placeholder="Search Google"
      autocomplete="off"
      autofocus
    >

    <div class="buttons">
      <button type="submit">Google Search</button>
      <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
    </div>
  </form>

</body>
</html>
